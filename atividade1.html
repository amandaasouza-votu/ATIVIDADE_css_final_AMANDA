<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        * {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-align: center;
        }
        .old{
            width: 300px;
            height: 200px;
            text-align: center;
        }
        #coral{
            color: lightcoral;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        #cor{
            background-color: rgb(127, 197, 255);
        }
        #font{
            color: rgb(253, 63, 142);
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif
        }
        #borda{
            border: 2px solid rgb(100, 136, 18);
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 30px;
        }
        #ul{
            color: rgb(255, 115, 0);
            background-color: rgb(105, 44, 216);
            font-size: 40px;
            text-decoration: underline;
            font-style: italic;
        }
    </style>
</head>

<body>
    <h1>PÁGINA TESTE CSS</h1>
    <hr>
    <img class="old" src="_images/css01.jpg">
    <img class="old" src="_images/css02.jpg">
    <img class="old" src="_images/css03.jpg">
    <img class="old" src="_images/css04.png">
    <hr>
    <h2 id="coral">CSS É VIDA!</h2>
    <p>Diversas possibilidades de incrementar seu HTML</p>
    <h1>Exemplo de Cores no CSS</h1>
    <p id="cor">Exemplo de texto com cor de fundo</p>
    <hr>
    <p id="font"><b>Exemplo de texto com mudança de cor de fonte </b></p>
    <hr>
    <p id="borda">Exemplo de texto com borda colorida</p>
    <h2>Misturando Tudo</h2>
    <p id="borda" style="color: rgb(1, 177, 110); text-decoration: underline;">Exemplo de texto com várias formatações </p>
    <hr>
    <h2 id="ul">Mais um exemplo</h2>

</body>

</html>
